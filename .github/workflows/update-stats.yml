name: Update profile stats

on:
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/update-stats.yml'
      - 'scripts/update_stats.py'
      - 'tests/test_update_stats.py'

permissions:
  contents: write

concurrency:
  group: update-profile-stats
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: main
      - name: Test refresh failure handling
        run: python3 -B -m unittest discover -s tests
      - name: Download and validate cards
        run: python3 -B scripts/update_stats.py
      - name: Commit refreshed cards
        run: |
          git add assets/github-stats.svg assets/top-languages.svg
          if git diff --cached --quiet; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m "chore: refresh profile stats"
          git push origin HEAD:main
